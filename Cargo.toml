[package]
name = "agentnudge"
version = "0.1.0"
edition = "2024"
description = "A local feedback rendezvous between software UIs and coding agents"
license = "MIT"
repository = "https://github.com/pablof7z/agentnudge"
readme = "README.md"
keywords = ["agent", "feedback", "ui", "annotation", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/web/dist/widget.js",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
